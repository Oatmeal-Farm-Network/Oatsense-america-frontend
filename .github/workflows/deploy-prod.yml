name: Deploy Oatsense Frontend Production

# main → oatsense-frontend-usa in animated-flare-421518 (Oatmeal AI).
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.PROD_GCP_PROJECT_ID || 'animated-flare-421518' }}
  REGION: ${{ vars.PROD_REGION || 'us-central1' }}
  GAR_REPOSITORY: ${{ vars.PROD_ARTIFACT_REGISTRY_REPOSITORY || 'cloud-run-source-deploy' }}
  SERVICE_NAME: oatsense-frontend-usa
  IMAGE_NAME: oatsense-frontend
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.PROD_FRONTEND_RUNTIME_SA }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Require Oatmeal AI project and WIF
        shell: bash
        run: |
          if [ "${{ env.PROJECT_ID }}" != "animated-flare-421518" ]; then
            echo "::error::Oatsense prod must use animated-flare-421518 (Oatmeal AI)."
            exit 1
          fi
          if [ -z "${{ secrets.PROD_GCP_WORKLOAD_IDENTITY_PROVIDER }}${{ secrets.PROD_GCP_WIF_PROVIDER }}" ]; then
            echo "::error::Set PROD_GCP_WORKLOAD_IDENTITY_PROVIDER (or PROD_GCP_WIF_PROVIDER)."
            exit 1
          fi
          if [ -z "${{ secrets.PROD_GCP_SERVICE_ACCOUNT }}" ]; then
            echo "::error::Set PROD_GCP_SERVICE_ACCOUNT."
            exit 1
          fi

      - name: Derive commit SHA tag
        run: echo "COMMIT_SHA=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.PROD_GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.PROD_GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.PROD_GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build Docker image (bake production VITE_*)
        env:
          VITE_API_URL: ${{ vars.PROD_API_URL || 'https://oatmealfarmnewtorkbackend-mt7mh6zhoa-uc.a.run.app' }}
          VITE_CROP_API_URL: ${{ vars.PROD_CROP_API_URL }}
          VITE_SAIGE_API_URL: ${{ vars.PROD_SAIGE_URL || 'https://saige-backend-mt7mh6zhoa-uc.a.run.app' }}
          VITE_NEWS_API_URL: ${{ vars.PROD_NEWS_API_URL }}
          VITE_OTF_API_URL: ${{ vars.PROD_OTF_API_URL }}
          VITE_CONTACT_RECIPIENT_EMAIL: ${{ vars.PROD_CONTACT_EMAIL }}
        run: |
          docker build \
            --build-arg "VITE_API_URL=${VITE_API_URL}" \
            --build-arg "VITE_CROP_API_URL=${VITE_CROP_API_URL}" \
            --build-arg "VITE_SAIGE_API_URL=${VITE_SAIGE_API_URL}" \
            --build-arg "VITE_NEWS_API_URL=${VITE_NEWS_API_URL}" \
            --build-arg "VITE_OTF_API_URL=${VITE_OTF_API_URL}" \
            --build-arg "VITE_CONTACT_RECIPIENT_EMAIL=${VITE_CONTACT_RECIPIENT_EMAIL}" \
            --build-arg "VITE_PRECISION_AG_ONLY=true" \
            -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}" \
            .

      - run: docker push "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}"

      - name: Deploy to oatsense-frontend-usa
        run: |
          extra=()
          if [ -n "${RUNTIME_SERVICE_ACCOUNT}" ]; then
            extra+=(--service-account "${RUNTIME_SERVICE_ACCOUNT}")
          fi
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            "${extra[@]}" \
            --quiet

      - name: Show deployed URL
        run: |
          gcloud run services describe "${SERVICE_NAME}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format='value(status.url)'
