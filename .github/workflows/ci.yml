name: CI

on:
  pull_request:
    branches:
      - 'GCP/frontend-staging'
      - 'GCP/frontend-testing'
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - name: Precision Ag production Vite build
        run: npm run build
