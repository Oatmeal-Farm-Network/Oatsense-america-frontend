# OatSense (Precision Ag independent) — Cloud Build → Artifact Registry
# Deploy to a NEW Cloud Run service (do not overwrite oatmealfarmnetwork-git).
#
# First-time deploy example:
#   gcloud run deploy oatsense-frontend \
#     --image us-central1-docker.pkg.dev/animated-flare-421518/cloud-run-source-deploy/oatsense-frontend \
#     --region us-central1 --platform managed --allow-unauthenticated \
#     --port 8080

substitutions:
  _API_URL: 'https://oatmealfarmnewtorkbackend-802455386518.us-central1.run.app'
  _CROP_API_URL: 'https://oatmealfarmnetworkcropmonitorbackend-git-802455386518.us-central1.run.app'
  _SAIGE_API_URL: 'https://saige-backend-802455386518.us-central1.run.app'
  _NEWS_API_URL: 'https://oatmeal-ai.com'
  _OTF_API_URL: 'https://oatmeal-main-802455386518.us-central1.run.app'
  _CONTACT_EMAIL: 'livestockoftheworld@gmail.com'
  _IMAGE: 'us-central1-docker.pkg.dev/animated-flare-421518/cloud-run-source-deploy/oatsense-frontend'

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_IMAGE}'
      - '--build-arg'
      - 'VITE_API_URL=${_API_URL}'
      - '--build-arg'
      - 'VITE_CROP_API_URL=${_CROP_API_URL}'
      - '--build-arg'
      - 'VITE_SAIGE_API_URL=${_SAIGE_API_URL}'
      - '--build-arg'
      - 'VITE_NEWS_API_URL=${_NEWS_API_URL}'
      - '--build-arg'
      - 'VITE_OTF_API_URL=${_OTF_API_URL}'
      - '--build-arg'
      - 'VITE_CONTACT_RECIPIENT_EMAIL=${_CONTACT_EMAIL}'
      - '--build-arg'
      - 'VITE_PRECISION_AG_ONLY=true'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE}']

images:
  - '${_IMAGE}'
